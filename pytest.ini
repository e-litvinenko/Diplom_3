[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --alluredir=./allure-results
markers =
    smoke: Smoke tests
    ui: UI tests
    chrome: Tests for Chrome browser
    firefox: Tests for Firefox browser